<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aivazovsky v7</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f6f4ef;
        --ink: #1f1f1f;
        --muted: #6f6a62;
        --line: rgba(196, 182, 163, 0.46);
        --shadow: 0 14px 40px rgba(28, 23, 15, 0.08);
        /* Синее смещение палитры */
        --sea-deep: #1a5f7a; /* синяя глубина */
        --sea-mid: #2185a0; /* основная волна — синее */
        --sea-bright: #3db8c8; /* гребень — синеватая бирюза */
        --sea-foam: #8fd6e4; /* пена — голубоватая */
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        /* amber orbs слева + sea orb справа, как на сайте */
        background-image: radial-gradient(
            ellipse 55% 38% at 8% 0%,
            rgba(246, 185, 65, 0.18) 0%,
            transparent 70%
          ),
          radial-gradient(
            ellipse 40% 30% at 30% 5%,
            rgba(246, 185, 65, 0.09) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse 50% 35% at 92% 2%,
            rgba(33, 133, 160, 0.11) 0%,
            transparent 68%
          );
        padding: 36px 28px;
        min-height: 100vh;
        color: var(--ink);
        font-family: 'Manrope', sans-serif;
      }
      h1 {
        margin-bottom: 6px;
        font-weight: 700;
        font-size: 20px;
        font-family: 'Space Grotesk', sans-serif;
      }
      .sub {
        margin-bottom: 28px;
        color: var(--muted);
        font-size: 12px;
      }

      .section-title {
        margin-bottom: 14px;
        color: var(--sea-deep);
        font-weight: 700;
        font-size: 9px;
        font-family: 'Space Grotesk', sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .fl {
        margin-bottom: 3px;
        color: var(--sea-bright);
        font-weight: 700;
        font-size: 9px;
        font-family: 'Space Grotesk', sans-serif;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .fl.m {
        color: var(--muted);
      }
      .fv {
        color: var(--ink);
        font-weight: 500;
        font-size: 13px;
      }
      .fv.p {
        color: rgba(111, 106, 98, 0.4);
      }
      .req {
        position: absolute;
        top: 10px;
        right: 10px;
        box-shadow: 0 0 5px rgba(220, 80, 60, 0.3);
        border-radius: 50%;
        background: rgba(220, 80, 60, 0.7);
        width: 5px;
        height: 5px;
      }

      /* wrap — amber orbs фон */
      .wrap {
        position: relative;
        margin: 0 auto;
        border-radius: 20px;
        background: linear-gradient(155deg, #f5f2eb 0%, #edf5f5 100%);
        padding: 28px;
        max-width: 380px;
        overflow: hidden;
      }
      /* amber orb сверху-слева */
      .wrap::before {
        position: absolute;
        top: -30px;
        left: -10px;
        z-index: 0;
        filter: blur(38px);
        border-radius: 50%;
        background: rgba(246, 185, 65, 0.22);
        width: 130px;
        height: 130px;
        content: '';
      }
      /* sea orb снизу-справа */
      .wrap::after {
        position: absolute;
        right: -5px;
        bottom: -20px;
        z-index: 0;
        filter: blur(32px);
        border-radius: 50%;
        background: rgba(61, 184, 200, 0.2);
        width: 110px;
        height: 110px;
        content: '';
      }
      /* маленький amber orb справа сверху */
      .orb-extra {
        position: absolute;
        top: 20px;
        right: 15px;
        z-index: 0;
        filter: blur(22px);
        border-radius: 50%;
        background: rgba(246, 185, 65, 0.14);
        width: 70px;
        height: 70px;
      }

      .card {
        position: relative;
        z-index: 1;
        backdrop-filter: blur(20px) saturate(145%);
        -webkit-backdrop-filter: blur(20px) saturate(145%);
        box-shadow:
          var(--shadow),
          0 0 44px rgba(61, 184, 200, 0.13),
          0 0 28px rgba(26, 95, 122, 0.07),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.72);
        border-radius: 14px;
        background: linear-gradient(
          155deg,
          rgba(255, 253, 248, 0.68) 0%,
          rgba(220, 244, 248, 0.58) 100%
        );
        padding: 22px;
      }

      .field {
        position: relative;
        margin-bottom: 8px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.82);
        border: 1px solid rgba(143, 214, 228, 0.48);
        border-radius: 10px;
        background: rgba(255, 253, 248, 0.5);
        padding: 15px 12px 7px;
      }
      .field.focus {
        box-shadow:
          0 0 0 3px rgba(61, 184, 200, 0.13),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        border-color: rgba(61, 184, 200, 0.52);
        background: rgba(220, 244, 248, 0.6);
      }

      .btn {
        margin-top: 10px;
        box-shadow:
          0 4px 18px rgba(61, 184, 200, 0.32),
          0 0 28px rgba(61, 184, 200, 0.14);
        border-radius: 999px;
        background: linear-gradient(
          135deg,
          var(--sea-bright),
          var(--sea-mid),
          var(--sea-deep)
        );
        padding: 9px 16px;
        color: #fff;
        font-weight: 700;
        font-size: 12px;
        font-family: 'Space Grotesk', sans-serif;
        text-align: center;
      }
      .del {
        margin-top: 5px;
        border: 1px solid rgba(220, 60, 40, 0.2);
        border-radius: 999px;
        background: transparent;
        padding: 7px 16px;
        color: rgba(200, 60, 40, 0.6);
        font-weight: 600;
        font-size: 11px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Айвазовский v7 — синее, с amber фоном</h1>
    <p class="sub">
      Синяя глубина #1a5f7a → волна #2185a0 → бирюза #3db8c8 · amber orbs на
      фоне как на сайте
    </p>

    <div class="wrap">
      <div class="orb-extra"></div>
      <div class="card">
        <div class="section-title">Personal Info</div>

        <div class="field focus">
          <div class="fl">First Name</div>
          <div class="fv">Daniil</div>
        </div>

        <div class="field">
          <div class="fl m">Email</div>
          <div class="fv">daniil@example.com</div>
          <div class="req"></div>
        </div>

        <div class="field">
          <div class="fl m">Company</div>
          <div class="fv">Ozma Inc.</div>
        </div>

        <div class="field">
          <div class="fl m">Notes</div>
          <div class="fv p">Add a note...</div>
        </div>

        <div class="btn">Save Changes</div>
        <div class="del">Delete Record</div>
      </div>
    </div>
  </body>
</html>
